name: Build Switch overlay
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test production layouts against font metrics
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Wno-unused-parameter tests/nvidia_layout.cpp -o /tmp/nvidia-layout-test
          /tmp/nvidia-layout-test
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64@sha256:82575ea78651b530b2e232bb3799cfd1fe331514e053d5f724bb4b28191fb79d
    steps:
      - uses: actions/checkout@v4
      - name: Build with warnings treated as errors
        run: make -j2
      - name: Prepare SD card tree
        run: |
          mkdir -p dist/switch/.overlays dist/config/status-monitor/fonts
          cp Status-Monitor-Nvidia-Overlay.ovl dist/switch/.overlays/
          cp config/status-monitor/fonts/* dist/config/status-monitor/fonts/
          cp docs/nvidia.md dist/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: NVIDIA-Style-Monitor-Switch
          path: dist/
          include-hidden-files: true
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && startsWith(github.event.head_commit.message, 'Release v')
    needs: [layout, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NVIDIA-Style-Monitor-Switch
          path: dist
      - name: Package release
        run: |
          mkdir -p release
          cp LICENSE dist/LICENSE-Status-Monitor.txt
          cp dist/switch/.overlays/Status-Monitor-Nvidia-Overlay.ovl release/
          version=$(awk '$1 == "APP_VERSION" {print $3}' Makefile)
          cd dist
          zip -r "../release/NVIDIA_Style_Monitor_v${version}_Switch.zip" .
          cd ../release
          sha256sum *.ovl *.zip > SHA256SUMS.txt
      - name: Publish verified binaries
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const version = fs.readFileSync('Makefile', 'utf8').match(/^APP_VERSION\s*:=\s*(\d+\.\d+\.\d+)$/m)[1];
            const tag = `v${version}`;
            const body = fs.readFileSync('docs/release-notes.md', 'utf8');
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({...context.repo, tag})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                ...context.repo, tag_name: tag, target_commitish: context.sha,
                name: `NVIDIA Style Monitor ${tag} — Вент. / Fan`, body, draft: true
              })).data;
            }
            const existing = (await github.rest.repos.listReleaseAssets({
              ...context.repo, release_id: release.id
            })).data;
            for (const name of fs.readdirSync('release')) {
              const old = existing.find(asset => asset.name === name);
              if (old) await github.rest.repos.deleteReleaseAsset({...context.repo, asset_id: old.id});
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo, release_id: release.id, name,
                data: fs.readFileSync(path.join('release', name))
              });
            }
            await github.rest.repos.updateRelease({
              ...context.repo, release_id: release.id, body, draft: false, make_latest: 'true'
            });
